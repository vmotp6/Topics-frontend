<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 登入測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #log { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Google 登入測試頁面</h1>
    
    <div class="section">
        <h2>1. 測試後端連接</h2>
        <button onclick="testBackend()">測試後端連接</button>
        <div id="backend-status"></div>
    </div>
    
    <div class="section">
        <h2>2. 測試 Google 登入</h2>
        <button onclick="testGoogleLogin()">開始 Google 登入</button>
        <div id="google-status"></div>
    </div>
    
    <div class="section">
        <h2>3. 檢查 Session 狀態</h2>
        <button onclick="checkSession()">檢查 Session</button>
        <div id="session-status"></div>
    </div>
    
    <div class="section">
        <h2>4. 調試日誌</h2>
        <div id="log"></div>
        <button onclick="clearLog()">清除日誌</button>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function testBackend() {
            log('測試後端連接...');
            try {
                const response = await fetch('http://localhost:5000/auth/google/url', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('backend-status').innerHTML = 
                        '<div class="success">✅ 後端連接正常</div>';
                    log('後端連接成功', 'success');
                    log('Google 登入 URL: ' + data.auth_url);
                } else {
                    document.getElementById('backend-status').innerHTML = 
                        '<div class="error">❌ 後端連接失敗: ' + response.status + '</div>';
                    log('後端連接失敗: ' + response.status, 'error');
                }
            } catch (error) {
                document.getElementById('backend-status').innerHTML = 
                    '<div class="error">❌ 後端連接錯誤: ' + error.message + '</div>';
                log('後端連接錯誤: ' + error.message, 'error');
            }
        }
        
        async function testGoogleLogin() {
            log('開始 Google 登入流程...');
            try {
                const response = await fetch('http://localhost:5000/auth/google/url', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('獲取 Google 登入 URL 成功', 'success');
                    log('重定向到: ' + data.auth_url);
                    
                    // 重定向到 Google 登入
                    window.location.href = data.auth_url;
                } else {
                    log('獲取 Google 登入 URL 失敗: ' + response.status, 'error');
                }
            } catch (error) {
                log('Google 登入錯誤: ' + error.message, 'error');
            }
        }
        
        async function checkSession() {
            log('檢查 Session 狀態...');
            try {
                const response = await fetch('debug_google_login.php', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const text = await response.text();
                    document.getElementById('session-status').innerHTML = 
                        '<div class="success">✅ Session 檢查完成</div><pre>' + text + '</pre>';
                    log('Session 檢查完成', 'success');
                } else {
                    log('Session 檢查失敗: ' + response.status, 'error');
                }
            } catch (error) {
                log('Session 檢查錯誤: ' + error.message, 'error');
            }
        }
        
        // 頁面載入時自動檢查 URL 參數
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('google_login')) {
                log('檢測到 Google 登入回調參數', 'info');
                log('google_login: ' + urlParams.get('google_login'));
                log('username: ' + urlParams.get('username'));
                log('role: ' + urlParams.get('role'));
                
                if (urlParams.get('google_login') === 'success') {
                    log('Google 登入成功！', 'success');
                } else {
                    log('Google 登入失敗', 'error');
                }
            }
        };
    </script>
</body>
</html>
