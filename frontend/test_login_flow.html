    <div class="section">
        <h2>4. 當前 URL 參數</h2>
        <div id="url-params"></div>
    </div>
    
    <div class="section">
        <h2>5. 調試日誌</h2>
        <div id="log"></div>
        <button onclick="clearLog()">清除日誌</button>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // 頁面載入時檢查 URL 參數
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramsDiv = document.getElementById('url-params');
            
            if (urlParams.toString()) {
                paramsDiv.innerHTML = '<pre>' + urlParams.toString() + '</pre>';
                log('檢測到 URL 參數: ' + urlParams.toString(), 'info');
                
                if (urlParams.has('google_login')) {
                    log('檢測到 Google 登入回調', 'info');
                    log('google_login: ' + urlParams.get('google_login'));
                    log('username: ' + urlParams.get('username'));
                    log('role: ' + urlParams.get('role'));
                    
                    if (urlParams.get('google_login') === 'success') {
                        log('Google 登入成功！', 'success');
                        
                        // 檢查是否會自動重定向
                        setTimeout(() => {
                            log('檢查頁面是否會自動重定向...', 'info');
                        }, 2000);
                    } else {
                        log('Google 登入失敗', 'error');
                    }
                }
            } else {
                paramsDiv.innerHTML = '無 URL 參數';
                log('無 URL 參數', 'info');
            }
            
            // 檢查當前頁面
            log('當前頁面: ' + window.location.pathname, 'info');
            log('完整 URL: ' + window.location.href, 'info');
        };
    </script>
