<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時穎白人聲模型測試 - 減少電子音</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #718096;
            font-size: 1.2em;
        }

        .improvement-banner {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            color: white;
            text-align: center;
        }

        .improvement-banner h2 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .improvement-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .improvement-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .improvement-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .improvement-text {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .voice-test-section {
            background: #f7fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .voice-test-section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .test-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #4a5568;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .test-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72, 187, 120, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(237, 137, 54, 0.3);
        }

        .results-section {
            background: #f7fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .results-section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .result-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-text {
            font-size: 1.1em;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .result-params {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .param-item {
            background: #f7fafc;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .param-label {
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 5px;
        }

        .param-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #2d3748;
        }

        .human-voice-features {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .human-voice-features h3 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .human-features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .human-feature-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            color: white;
        }

        .human-feature-label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-bottom: 3px;
        }

        .human-feature-value {
            font-size: 1em;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .success {
            background: #c6f6d5;
            color: #2f855a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .audio-player {
            margin-top: 15px;
        }

        .audio-player audio {
            width: 100%;
            border-radius: 5px;
        }

        .comparison-section {
            background: #fff5f5;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .comparison-section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .comparison-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .comparison-title {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .comparison-params {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .test-buttons {
                flex-direction: column;
            }
            
            .result-params {
                grid-template-columns: 1fr;
            }
            
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 時穎白人聲模型測試</h1>
            <p>減少電子音，增加人聲自然度</p>
        </div>

        <div class="improvement-banner">
            <h2>🎵 人聲改進功能</h2>
            <div class="improvement-list">
                <div class="improvement-item">
                    <div class="improvement-icon">🎤</div>
                    <div class="improvement-text">減少電子音</div>
                </div>
                <div class="improvement-item">
                    <div class="improvement-icon">❤️</div>
                    <div class="improvement-text">增加人聲自然度</div>
                </div>
                <div class="improvement-item">
                    <div class="improvement-icon">🎵</div>
                    <div class="improvement-text">優化語音參數</div>
                </div>
                <div class="improvement-item">
                    <div class="improvement-icon">🔧</div>
                    <div class="improvement-text">添加人聲後處理</div>
                </div>
            </div>
        </div>

        <div class="voice-test-section">
            <h2>🎵 人聲語音生成測試</h2>
            <form class="test-form" id="voiceTestForm">
                <div class="form-group">
                    <label for="testText">測試文字：</label>
                    <textarea id="testText" rows="3" placeholder="輸入要轉換為時穎白人聲的文字...">こんにちは、私は時穎白です</textarea>
                </div>

                <div class="form-group">
                    <label for="voiceStyle">語音風格：</label>
                    <select id="voiceStyle">
                        <option value="mysterious">神秘可愛</option>
                        <option value="cute">溫柔甜美</option>
                        <option value="mature">成熟穩重</option>
                        <option value="dangerous">危險迷人</option>
                    </select>
                </div>

                <div class="test-buttons">
                    <button type="button" class="btn btn-primary" onclick="generateHumanVoice()">🎭 生成人聲語音</button>
                    <button type="button" class="btn btn-secondary" onclick="testPresetTexts()">🎵 測試預設文字</button>
                    <button type="button" class="btn btn-warning" onclick="compareVersions()">⚖️ 版本比較</button>
                    <button type="button" class="btn btn-secondary" onclick="clearResults()">🗑️ 清除結果</button>
                </div>
            </form>
        </div>

        <div class="results-section">
            <h2>📋 人聲生成結果</h2>
            <div id="resultsContainer">
                <div class="loading">等待人聲語音生成...</div>
            </div>
        </div>

        <div class="comparison-section" id="comparisonSection" style="display: none;">
            <h2>⚖️ 版本比較</h2>
            <div class="comparison-grid">
                <div class="comparison-item">
                    <div class="comparison-title">🔧 原始版本</div>
                    <div class="comparison-params" id="originalParams">
                        <div class="param-item">
                            <div class="param-label">音調</div>
                            <div class="param-value">0.500</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">速度</div>
                            <div class="param-value">0.800</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">音量</div>
                            <div class="param-value">0.700</div>
                        </div>
                    </div>
                </div>
                <div class="comparison-item">
                    <div class="comparison-title">🎭 人聲版本</div>
                    <div class="comparison-params" id="humanParams">
                        <div class="param-item">
                            <div class="param-label">音調</div>
                            <div class="param-value">0.650</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">速度</div>
                            <div class="param-value">0.850</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">音量</div>
                            <div class="param-value">0.750</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 預設測試文字
        const presetTexts = [
            "こんにちは、私は時穎白です",
            "時崎狂三の声で話しています",
            "神秘で可愛い声を聞いてください",
            "私はあなたの声を覚えています",
            "一緒に遊びましょう"
        ];

        // 生成人聲語音
        async function generateHumanVoice() {
            const text = document.getElementById('testText').value;
            const style = document.getElementById('voiceStyle').value;
            
            if (!text.trim()) {
                alert('請輸入測試文字！');
                return;
            }

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">🎭 正在生成時穎白人聲語音...</div>';

            try {
                // 調用改進的 API
                const response = await fetch('/Topics-frontend/backend/api/voice/改進時穎白語音API.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        style: style,
                        generate_audio: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP 錯誤: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    displayHumanVoiceResult(data.voice_params, data.audio);
                } else {
                    throw new Error(data.error || '人聲語音生成失敗');
                }
            } catch (error) {
                console.error('API 錯誤:', error);
                resultsContainer.innerHTML = `<div class="error">❌ 人聲語音生成失敗: ${error.message}</div>`;
            }
        }

        // 顯示人聲語音結果
        function displayHumanVoiceResult(params, audio = null) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            let audioHtml = '';
            if (audio && audio.success) {
                audioHtml = `
                    <div class="audio-player">
                        <audio controls>
                            <source src="${audio.audio_url}" type="audio/wav">
                            您的瀏覽器不支援音頻播放。
                        </audio>
                        <p style="color: #718096; font-size: 0.9em; margin-top: 10px;">
                            ✅ 時穎白人聲語音已生成！檔案大小: ${(audio.file_size / 1024).toFixed(1)} KB
                        </p>
                    </div>
                `;
            } else if (audio && !audio.success) {
                audioHtml = `
                    <div class="error">
                        ❌ 音頻生成失敗: ${audio.error}
                    </div>
                `;
            } else {
                audioHtml = `
                    <div class="audio-player">
                        <p style="color: #718096; font-size: 0.9em; margin-top: 10px;">
                            💡 人聲語音參數已生成，音頻生成功能需要整合 TTS 系統
                        </p>
                    </div>
                `;
            }
            
            const resultHtml = `
                <div class="result-item">
                    <div class="result-header">
                        <div class="result-text">"${params.text}"</div>
                    </div>
                    <div class="result-params">
                        <div class="param-item">
                            <div class="param-label">音調</div>
                            <div class="param-value">${params.pitch.toFixed(3)}</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">速度</div>
                            <div class="param-value">${params.speed.toFixed(3)}</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">音量</div>
                            <div class="param-value">${params.volume.toFixed(3)}</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">情感</div>
                            <div class="param-value">${params.emotion}</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">風格分數</div>
                            <div class="param-value">${params.style_score.toFixed(3)}</div>
                        </div>
                        <div class="param-item">
                            <div class="param-label">角色</div>
                            <div class="param-value">${params.character}</div>
                        </div>
                    </div>
                    <div class="human-voice-features">
                        <h3>🎤 人聲特徵</h3>
                        <div class="human-features-grid">
                            <div class="human-feature-item">
                                <div class="human-feature-label">呼吸感</div>
                                <div class="human-feature-value">${params.breathiness ? params.breathiness.toFixed(3) : '0.200'}</div>
                            </div>
                            <div class="human-feature-item">
                                <div class="human-feature-label">溫暖度</div>
                                <div class="human-feature-value">${params.warmth ? params.warmth.toFixed(3) : '0.800'}</div>
                            </div>
                            <div class="human-feature-item">
                                <div class="human-feature-label">清晰度</div>
                                <div class="human-feature-value">${params.clarity ? params.clarity.toFixed(3) : '0.900'}</div>
                            </div>
                            <div class="human-feature-item">
                                <div class="human-feature-label">人聲類型</div>
                                <div class="human-feature-value">${params.voice_type || 'human_like'}</div>
                            </div>
                        </div>
                    </div>
                    ${audioHtml}
                </div>
            `;
            
            resultsContainer.innerHTML = resultHtml;
        }

        // 測試預設文字
        async function testPresetTexts() {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">🎵 正在測試預設文字...</div>';

            let allResults = '';
            
            for (let i = 0; i < presetTexts.length; i++) {
                const text = presetTexts[i];
                const style = 'mysterious'; // 預設使用神秘風格
                
                try {
                    const response = await fetch('/Topics-frontend/backend/api/voice/改進時穎白語音API.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            text: text,
                            style: style,
                            generate_audio: false
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            allResults += `
                                <div class="result-item">
                                    <div class="result-header">
                                        <div class="result-text">"${data.voice_params.text}"</div>
                                    </div>
                                    <div class="result-params">
                                        <div class="param-item">
                                            <div class="param-label">音調</div>
                                            <div class="param-value">${data.voice_params.pitch.toFixed(3)}</div>
                                        </div>
                                        <div class="param-item">
                                            <div class="param-label">速度</div>
                                            <div class="param-value">${data.voice_params.speed.toFixed(3)}</div>
                                        </div>
                                        <div class="param-item">
                                            <div class="param-label">音量</div>
                                            <div class="param-value">${data.voice_params.volume.toFixed(3)}</div>
                                        </div>
                                        <div class="param-item">
                                            <div class="param-label">情感</div>
                                            <div class="param-value">${data.voice_params.emotion}</div>
                                        </div>
                                        <div class="param-item">
                                            <div class="param-label">風格分數</div>
                                            <div class="param-value">${data.voice_params.style_score.toFixed(3)}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                } catch (error) {
                    allResults += `<div class="error">❌ 測試失敗: ${text}</div>`;
                }
            }
            
            resultsContainer.innerHTML = allResults;
        }

        // 版本比較
        function compareVersions() {
            const comparisonSection = document.getElementById('comparisonSection');
            comparisonSection.style.display = comparisonSection.style.display === 'none' ? 'block' : 'none';
        }

        // 清除結果
        function clearResults() {
            document.getElementById('resultsContainer').innerHTML = '<div class="loading">等待人聲語音生成...</div>';
            document.getElementById('comparisonSection').style.display = 'none';
        }

        // 頁面載入時顯示歡迎訊息
        window.addEventListener('load', function() {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = `
                <div class="success">
                    ✅ 時穎白人聲模型已載入完成！<br>
                    🎭 改進功能：減少電子音，增加人聲自然度<br>
                    🎵 新增人聲特徵：呼吸感、溫暖度、清晰度<br>
                    💡 請輸入文字開始測試人聲語音生成
                </div>
            `;
        });
    </script>
</body>
</html>
